# Managed by the Plumber platform: onboarding wrote this file and unboarding deletes it.
name: Plumber
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  plumber:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: getplumber/plumber@7e581015a1295a49a7af14b346231d2fd8dff695 # v0.7.12
        with:
          platform: https://demo-github.getplumber.tech
